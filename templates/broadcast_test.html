<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Test Broadcast Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-light p-5">
    <div id="root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState } = React;

        function TestApp() {
            const [message, setMessage] = useState("Test message");
            const [loading, setLoading] = useState(false);
            const [result, setresult] = useState(null);

            const runSumulation = async () => {
                setLoading(true);
                setHasil(null);
                
                try {
                    const response = await fetch('/api/test-broadcast', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    const data = await response.json();
                    setResult(data);
                } catch (error) {
                    alert("Sys error");
                }
                setLoading(false);
            };

            return (
                <div className="container" style={{maxWidth: '800px'}}>
                    <div className="card shadow-sm border-0">
                        <div className="card-header bg-warning text-dark fw-bold">
                            🚧 Testing Simulator Broadcast
                        </div>
                        <div className="card-body">
                            <div className="mb-3">
                                <label className="form-label fw-bold">Isi Pesan Test</label>
                                <textarea className="form-control" rows="3" value={message} onChange={e => setMessage(e.target.value)}></textarea>
                            </div>
                            <button className="btn btn-primary" onClick={runSumulation} disabled={loading}>
                                {loading ? "Memproses Data..." : "Jalankan Simulasi"}
                            </button>

                            {result && (
                                <div className="mt-4">
                                    <div className="alert alert-info">
                                        <b>Status:</b> Simulasi Selesai <br/>
                                        <b>Berhasil (Whitelist):</b> {result.total_success} <br/>
                                        <b>Dilewati (Acak):</b> {result.total_skipped}
                                    </div>
                                    <div className="bg-dark text-white p-3 rounded" style={{maxHeight: '300px', overflowY: 'auto', fontFamily: 'monospace', fontSize: '14px'}}>
                                        {hasil.logs.map((log, i) => (
                                            <div key={i} className="mb-1">{log}</div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TestApp />);
    </script>
    {% endraw %}
</body>
</html>
