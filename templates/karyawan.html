<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Data Karyawan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script id="server-data" type="application/json">
    {
        "employeeList": {{ employee_list_json | safe }}
    }
    </script>
    <script>
        window.SERVER_DATA = JSON.parse(document.getElementById('server-data').textContent);
    </script>

    {% raw %}
    <script type="text/babel">
        const { useState, useMemo } = React; 

        function Sidebar({ activePage }) {
            return (
                <div style={styles.sidebar}>
                    <h4 style={styles.sidebarHeader}><i className="bi bi-robot me-2"></i>OfficeAssist</h4>
                    <nav>
                        <a href="/" style={{...styles.sidebarLink, ...(activePage === 'dashboard' ? styles.sidebarLinkActive : {})}}><i className="bi bi-speedometer2 me-2"></i>Dashboard</a>
                        <a href="/karyawan" style={{...styles.sidebarLink, ...(activePage === 'karyawan' ? styles.sidebarLinkActive : {})}}><i className="bi bi-people me-2"></i>Karyawan</a>
                        <a href="/inventaris" style={{...styles.sidebarLink, ...(activePage === 'inventaris' ? styles.sidebarLinkActive : {})}}><i className="bi bi-box-seam me-2"></i>Inventaris</a>
                        <a href="/audit-log" style={{...styles.sidebarLink, ...(activePage === 'audit-log' ? styles.sidebarLinkActive : {})}}><i className="bi bi-journal-text me-2"></i>Audit Log</a>
                        <a href="/broadcast" style={{...styles.sidebarLink, ...(activePage === 'broadcast' ? styles.sidebarLinkActive : {})}}><i className="bi bi-broadcast me-2"></i>Broadcast</a>
                    </nav>
                </div>
            );
        }

        function KaryawanApp() {
            const [data, setData] = useState(window.SERVER_DATA.employeeList);
            
            const [sortConfig, setSortConfig] = useState({key: 'employee_id', direction: 'ascending'});
            const [filterDivision, setFilterDivision] = useState('');
            const [filterRole, setFilterRole] = useState('');

            const [currentPage, setCurrentPage] = useState(1);
            const itemsPerPage = 10;

            const totalPages = Math.ceil(data.length / itemsPerPage);
            if (currentPage > totalPages && totalPages > 0) setCurrentPage(1);

            const [showModal, setShowModal] = useState(false);
            const [formData, setFormData] = useState({
                employee_id: '',
                auto_id: true,
                full_name: '',
                whatsapp_number: '',
                division: '',
                role: 'karyawan'
            });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const uniqueDivisions = useMemo(()=> {
                const divSet = new Set(window.SERVER_DATA.employeeList.map(k => k.division).filter(Boolean));
                return Array.from(divSet).sort();
            }, []);

            const processedData = useMemo(() => {
                let filtered = [...data];

                if (filterDivision) filtered = filtered.filter(k => k.division === filterDivision);
                if (filterRole) filtered = filtered.filter(k => k.role === filterRole);

                filtered.sort((a, b) => {
                    if (a[sortConfig.key] < b[sortConfig.key]) return sortConfig.direction === 'ascending' ? -1 : 1;
                    if (a[sortConfig.key] > b[sortConfig.key]) return sortConfig.direction === 'ascending' ? 1 : -1;
                    return 0;
                });

                return filtered;
            }, [data, filterDivision, filterRole, sortConfig]);

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentItems = processedData.slice(indexOfFirstItem, indexOfLastItem);

            const requestSort = (key) => {
                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction});
            };

            const getSortIcon = (columnName) => {
                if (sortConfig.key !== columnName) return <i className="bi bi-arrow-down-up ms-1 text-secondary opacity-50"></i>;
                return sortConfig.direction === 'ascending' ? <i className="bi bi-sort-alpha-down ms-1 text-warning"></i> : <i className="bi bi-sort-alpha-up ms-1 text-warning"></i>;
            };

            const handleInputChange =(e)=> {
                const target = e.target;
                const value = target.type === 'checkbox' ? target.checked : target.value;
                setFormData({ ...formData, [target.name]: value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                const payload = {...formData};
                if (payload.auto_id) payload.employee_id = "";

                try{
                    const response =  await fetch ('/api/employees', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(payload) 
                    });
                    const result = await response.json();

                    if (response.ok) {
                        alert(result.pesan);
                        setShowModal(false);
                        window.location.reload();
                    } else {
                        alert(result.pesan || "Terjadi kesalahan pada input data.");
                    }
                } catch (error) { 
                    console.error("error submit data", error);
                    alert('Terjadi kesalahan koneksi');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleDelete = async (id) => {
                if (!id) return alert("Data ini tidak memiliki ID yang valid. Silakan hapus manual.");
                if (window.confirm(`Apakah Anda yakin ingin menghapus data karyawan dengan ID ${id}?`)) {
                    try {
                        const response = await fetch(`/api/employees/${id}`, { method: 'DELETE' });
                        const result = await response.json();
                        if (response.ok) {
                            alert(result.pesan);
                            window.location.reload();
                        } else {
                            alert(result.pesan || "Terjadi kesalahan saat menghapus data.");
                        }
                    } catch (error) {
                        alert('Terjadi kesalahan koneksi ke server.');
                    }
                }
            };

            return (
                <div style={styles.bodyBackground}>
                    <div className="container-fluid">
                        <div className="row">
                            <div className="col-md-2 p-0"><Sidebar activePage="karyawan" /></div>
                            <div className="col-md-10 p-4">
                                <div className="d-flex justify-content-between align-items-center mb-4">
                                    <h2 className="fw-bold m-0">Master Data Karyawan</h2>
                                    <button className="btn btn-primary" onClick={() => setShowModal(true)}>
                                        <i className="bi bi-plus-lg me-2"></i>Tambah Karyawan
                                    </button>
                                </div>
                                
                                {/* filter */}
                                <div className="card shadow-sm border-0 mb-3 bg-white">
                                    <div className="card-body p-3 d-flex gap-3 align-items-end">
                                        <div style={{minWidth: '200px'}}>
                                            <label className="form-label text-muted small fw-bold mb-1">Filter Divisi</label>
                                            <select className="form-select form-select-sm" value={filterDivision} onChange={(e) => {setFilterDivision(e.target.value); setCurrentPage(1);}}>
                                                <option value="">Semua Divisi</option>
                                                {uniqueDivisions.map(div => <option key={div} value={div}>{div}</option>)}
                                            </select>
                                        </div>
                                        <div style={{minWidth: '200px'}}>
                                            <label className="form-label text-muted small fw-bold mb-1">Filter Role</label>
                                            <select className="form-select form-select-sm" value={filterRole} onChange={(e) => {setFilterRole(e.target.value); setCurrentPage(1);}}>
                                                <option value="">Semua Role</option>
                                                <option value="admin">Admin</option>
                                                <option value="karyawan">Karyawan</option>
                                            </select>
                                        </div>
                                        <div className="ms-auto text-muted small">Total: {processedData.length} Data</div>
                                    </div>
                                </div>

                                {/* table */}
                                <div className="card shadow-sm border-0">
                                    <div className="card-body p-0">
                                        <table className="table table-hover table-striped mb-0">
                                            <thead>
                                                <tr style={styles.tableHeader}>
                                                    <th style={{cursor: 'pointer'}} onClick={() => requestSort('employee_id')}>ID Karyawan {getSortIcon('employee_id')}</th>
                                                    <th style={{cursor: 'pointer'}} onClick={() => requestSort('full_name')}>Nama Lengkap {getSortIcon('full_name')}</th>
                                                    <th style={{cursor: 'pointer'}} onClick={() => requestSort('whatsapp_number')}>Nomor WA {getSortIcon('whatsapp_number')}</th>
                                                    <th style={{cursor: 'pointer'}} onClick={() => requestSort('division')}>Divisi {getSortIcon('division')}</th>
                                                    <th style={{cursor: 'pointer'}} onClick={() => requestSort('role')}>Role {getSortIcon('role')}</th>
                                                    <th className="text-center">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {currentItems.length > 0 ? (
                                                    currentItems.map((k, i) => (
                                                        <tr key={i}>
                                                            <td className="fw-bold">{k.employee_id || <span className="text-danger fst-italic">NULL</span>}</td>
                                                            <td>{k.full_name}</td>
                                                            <td>{k.whatsapp_number}</td>
                                                            <td>{k.division}</td>
                                                            <td><span className={`badge ${k.role === 'admin' ? 'bg-primary' : 'bg-secondary'}`}>{k.role}</span></td>
                                                            <td className="text-center">
                                                                <button className="btn btn-sm btn-outline-danger" onClick={() => handleDelete(k.employee_id)} title="Hapus Karyawan">
                                                                    <i className="bi bi-trash"></i>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                ) : (
                                                    <tr><td colSpan="6" className="text-center py-5 text-muted">Data tidak ditemukan.</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                    
                                    {/* pagination */}
                                    <div className="card-footer bg-white d-flex justify-content-between align-items-center py-3">
                                        <small className="text-muted">Menampilkan {processedData.length > 0 ? indexOfFirstItem + 1 : 0} - {Math.min(indexOfLastItem, processedData.length)} dari {processedData.length} data</small>
                                        <div>
                                            <button className="btn btn-sm btn-outline-secondary me-2" onClick={() => setCurrentPage(currentPage - 1)} disabled={currentPage === 1}><i className="bi bi-chevron-left"></i></button>
                                            <span className="text-muted mx-2 small">Hal {currentPage} / {totalPages || 1}</span>
                                            <button className="btn btn-sm btn-outline-secondary" onClick={() => setCurrentPage(currentPage + 1)} disabled={currentPage === totalPages || totalPages === 0}><i className="bi bi-chevron-right"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* modal */}
                    {showModal && (
                        <div className="modal show d-block" style={{ backgroundColor: 'rgba(0,0,0,0.5)', zIndex: 1050 }}>
                            <div className="modal-dialog modal-dialog-centered">
                                <div className="modal-content border-0 shadow-lg">
                                    <form onSubmit={handleSubmit}>
                                        <div className="modal-header bg-primary text-white">
                                            <h5 className="modal-title fw-bold"><i className="bi bi-person-plus me-2"></i>Tambah Karyawan</h5>
                                            <button type="button" className="btn-close btn-close-white" onClick={() => setShowModal(false)}></button>
                                        </div>
                                        <div className="modal-body p-4 bg-light">
                                            <div className="card border-0 shadow-sm mb-4">
                                                <div className="card-body bg-white rounded">
                                                    <div className="d-flex justify-content-between align-items-center mb-2">
                                                        <label className="form-label fw-bold m-0">ID Karyawan</label>
                                                        <div className="form-check form-switch m-0">
                                                            <input className="form-check-input" type="checkbox" role="switch" id="autoIdSwitch" name="auto_id" checked={formData.auto_id} onChange={handleInputChange} />
                                                            <label className="form-check-label small text-muted ms-1" htmlFor="autoIdSwitch">Auto-Generate</label>
                                                        </div>
                                                    </div>
                                                    {!formData.auto_id && (
                                                        <input type="text" className="form-control" name="employee_id" placeholder="Ketik ID Karyawan Manual..." value={formData.employee_id} onChange={handleInputChange} required={!formData.auto_id} />
                                                    )}
                                                </div>
                                            </div>
                                            <div className="mb-3">
                                                <label className="form-label small fw-bold text-muted">Nama Lengkap</label>
                                                <input type="text" className="form-control shadow-sm" name="full_name" value={formData.full_name} onChange={handleInputChange} required />
                                            </div>
                                            <div className="mb-4">
                                                <label className="form-label small fw-bold text-muted">Nomor WhatsApp (Unik)</label>
                                                <input type="number" className="form-control shadow-sm" name="whatsapp_number" placeholder="Contoh: 62812345678" value={formData.whatsapp_number} onChange={handleInputChange} required />
                                            </div>
                                            <div className="row">
                                                <div className="col-md-6 mb-3">
                                                    <label className="form-label small fw-bold text-muted">Divisi</label>
                                                    <input type="text" className="form-control shadow-sm" name="division" value={formData.division} onChange={handleInputChange} required />
                                                </div>
                                                <div className="col-md-6 mb-3">
                                                    <label className="form-label small fw-bold text-muted">Role Akses</label>
                                                    <select className="form-select shadow-sm" name="role" value={formData.role} onChange={handleInputChange}>
                                                        <option value="karyawan">Karyawan</option>
                                                        <option value="admin">Admin</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="modal-footer">
                                            <button type="button" className="btn btn-light border" onClick={() => setShowModal(false)} disabled={isSubmitting}>Batal</button>
                                            <button type="submit" className="btn btn-primary px-4" disabled={isSubmitting}>
                                                {isSubmitting ? <span className="spinner-border spinner-border-sm me-2"></span> : <i className="bi bi-save me-2"></i>} Simpan
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const styles = {
            bodyBackground: { backgroundColor: '#f4f6f9', minHeight: '100vh' },
            sidebar: { minHeight: '100vh', backgroundColor: '#203764', color: '#ffffff', padding: '20px' },
            sidebarHeader: { textAlign: 'center', marginBottom: '1.5rem', borderBottom: '1px solid rgba(255, 255, 255, 0.2)', paddingBottom: '1rem' },
            sidebarLink: { color: '#cfd8dc', textDecoration: 'none', padding: '12px 15px', display: 'block', borderRadius: '5px', marginBottom: '5px', transition: 'all 0.3s' },
            sidebarLinkActive: { backgroundColor: '#162646', color: '#ffffff', fontWeight: 'bold' },
            tableHeader: { backgroundColor: '#203764', color: '#ffffff', userSelect: 'none' }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<KaryawanApp />);
    </script>
    {% endraw %}
</body>
</html>
