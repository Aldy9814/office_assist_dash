<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfficeAssist - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script id="server-data" type="application/json">
    {
        "totalKaryawan": {{ total_karyawan }},
        "totalInventaris": {{ total_inventaris }},
        "totalInteraksi": {{ total_interaksi }},
        "auditLogs": {{ audit_logs_json | safe }}
    }
    </script>
    <script>
        window.SERVER_DATA = JSON.parse(document.getElementById('server-data').textContent);
    </script>

    {% raw %}
    <script type="text/babel">
        const { useState } = React;

        function Sidebar({ activePage }) {
            return (
                <div style={styles.sidebar}>
                    <h4 style={styles.sidebarHeader}>
                        <i className="bi bi-robot me-2"></i>OfficeAssist
                    </h4>
                    <nav>
                        <a href="/" style={{...styles.sidebarLink, ...(activePage === 'dashboard' ? styles.sidebarLinkActive : {})}}>
                            <i className="bi bi-speedometer2 me-2"></i>Dashboard
                        </a>
                        <a href="/karyawan" style={{...styles.sidebarLink, ...(activePage === 'karyawan' ? styles.sidebarLinkActive : {})}}>
                            <i className="bi bi-people me-2"></i>Karyawan
                        </a>
                        <a href="/inventaris" style={{...styles.sidebarLink, ...(activePage === 'inventaris' ? styles.sidebarLinkActive : {})}}>
                            <i className="bi bi-box-seam me-2"></i>Inventaris
                        </a>
                        <a href="/audit-log" style={{...styles.sidebarLink, ...(activePage === 'audit-log' ? styles.sidebarLinkActive : {})}}>
                            <i className="bi bi-journal-text me-2"></i>Audit Log
                        </a>
                    </nav>
                </div>
            );
        }

        function DashboardApp() {
            const [data] = useState(window.SERVER_DATA);

            return (
                <div style={styles.bodyBackground}>
                    <div className="container-fluid">
                        <div className="row">
                            <div className="col-md-2 p-0">
                                <Sidebar activePage="dashboard" />
                            </div>
                            <div className="col-md-10 p-4">
                                <div className="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
                                    <h2 className="fw-bold">Admin Dashboard</h2>
                                    <div>
                                        <span className="badge bg-success fs-6"><i className="bi bi-check-circle me-1"></i> Bot Aktif</span>
                                    </div>
                                </div>

                                <div className="row mb-4">
                                    <div className="col-md-4">
                                        <div style={styles.cardStatPrimary} className="p-3">
                                            <h6 className="text-muted">Total Karyawan</h6>
                                            <h3 className="fw-bold m-0">{data.totalKaryawan}</h3>
                                        </div>
                                    </div>
                                    <div className="col-md-4">
                                        <div style={styles.cardStatWarning} className="p-3">
                                            <h6 className="text-muted">Total Inventaris</h6>
                                            <h3 className="fw-bold m-0">{data.totalInventaris}</h3>
                                        </div>
                                    </div>
                                    <div className="col-md-4">
                                        <div style={styles.cardStatSuccess} className="p-3">
                                            <h6 className="text-muted">Interaksi Hari Ini</h6>
                                            <h3 className="fw-bold m-0">{data.totalInteraksi}</h3>
                                        </div>
                                    </div>
                                </div>

                                <div className="card shadow-sm border-0">
                                    <div className="card-header bg-white py-3">
                                        <h5 className="mb-0 fw-bold"><i className="bi bi-clock-history me-2"></i> Aktivitas WhatsApp Terbaru</h5>
                                    </div>
                                    <div className="card-body p-0">
                                        <div className="table-responsive">
                                            <table className="table table-hover table-striped mb-0">
                                                <thead>
                                                    <tr style={styles.tableHeader}>
                                                        <th>Waktu</th>
                                                        <th>Nomor WA</th>
                                                        <th>Pesan Masuk</th>
                                                        <th>Intent AI</th>
                                                        <th>Status</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {data.auditLogs && data.auditLogs.length > 0 ? (
                                                        data.auditLogs.map((log, index) => (
                                                            <tr key={index}>
                                                                <td>{log.waktu}</td>
                                                                <td>{log.nomor_wa}</td>
                                                                <td>{log.pesan_masuk}</td>
                                                                <td><span className="badge bg-info text-dark">{log.intent_terdeteksi}</span></td>
                                                                <td>
                                                                    {log.status_response === 'sukses' ? (
                                                                        <span className="badge bg-success">Sukses</span>
                                                                    ) : (
                                                                        <span className="badge bg-secondary">{log.status_response}</span>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))
                                                    ) : (
                                                        <tr>
                                                            <td colSpan="5" className="text-center text-muted py-4">Belum ada riwayat aktivitas pesan di database.</td>
                                                        </tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const styles = {
            bodyBackground: {
                backgroundColor: '#f4f6f9',
                minHeight: '100vh'
            },
            sidebar: {
                minHeight: '100vh',
                backgroundColor: '#203764',
                color: '#ffffff',
                padding: '20px'
            },
            sidebarHeader: {
                textAlign: 'center',
                marginBottom: '1.5rem',
                borderBottom: '1px solid rgba(255, 255, 255, 0.2)',
                paddingBottom: '1rem'
            },
            sidebarLink: {
                color: '#cfd8dc',
                textDecoration: 'none',
                padding: '12px 15px',
                display: 'block',
                borderRadius: '5px',
                marginBottom: '5px',
                transition: 'all 0.3s'
            },
            sidebarLinkActive: {
                backgroundColor: '#162646',
                color: '#ffffff',
                fontWeight: 'bold'
            },
            cardStatPrimary: {
                backgroundColor: '#ffffff',
                borderLeft: '4px solid #0d6efd',
                borderRadius: '8px',
                boxShadow: '0 0.125rem 0.25rem rgba(0, 0, 0, 0.075)'
            },
            cardStatWarning: {
                backgroundColor: '#ffffff',
                borderLeft: '4px solid #ffc107',
                borderRadius: '8px',
                boxShadow: '0 0.125rem 0.25rem rgba(0, 0, 0, 0.075)'
            },
            cardStatSuccess: {
                backgroundColor: '#ffffff',
                borderLeft: '4px solid #198754',
                borderRadius: '8px',
                boxShadow: '0 0.125rem 0.25rem rgba(0, 0, 0, 0.075)'
            },
            tableHeader: {
                backgroundColor: '#203764',
                color: '#ffffff'
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardApp />);
    </script>
    {% endraw %}
</body>
</html>
